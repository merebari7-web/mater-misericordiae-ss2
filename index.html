<!doctype html>
<html lang="en">

      <span class="brand-copy"><strong>Mater Misericordiae</strong><small>SECONDARY SCHOOL · RUMOMASI</small></span>

    <div class="topbar-meta"><span class="live-dot"></span> SS2 <span class="meta-divider">/</span> FIRST TERM 2026/2027</div>

  <div class="page-layout">
    <div class="scrim" id="scrim"></div>
    <aside class="sidebar" id="sidebar" aria-label="Course navigation">
      <div class="sidebar-label">LEARNING MATERIALS</div>

      <div id="app" aria-live="polite" aria-busy="true">
        <div class="loading-state"><span class="loader"></span><p>Preparing your study materials…</p></div>
      </div>
      <footer class="site-footer"><span>Mater Misericordiae Secondary School, Rumomasi</span><span>SS2 · First Term 2026/2027</span></footer>
